services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: factory-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  factory-hub:
    build: .
    container_name: factory-hub
    depends_on:
      - mqtt-broker
    env_file:
      - .env
    environment:
      - MQTT_BROKER=mqtt-broker
      - PLC_HOST=host.docker.internal
      - DB_PATH=/app/data/factory_telemetry.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
